name: Apply Binance balance authority patch

on:
  push:
    branches:
      - fix/binance-authoritative-balances

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/binance-authoritative-balances
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_binance_authoritative_balances.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make Binance balances authoritative'
          git push
