name: Apply exit policy v2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply exit policy v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply_exit_policy_v2.py
      - name: Align timeout-profit test with new policy
        run: |
          sed -i 's/opened_at = int(__import__("time").time()) - 1900/opened_at = int(__import__("time").time()) - 2800/' tests/test_portfolio_live.py
          sed -i 's/client.price = Decimal("100.30")/client.price = Decimal("100.45")/' tests/test_portfolio_live.py
      - name: Run focused tests
        run: python -m unittest tests.test_scalping tests.test_portfolio_live
      - name: Commit optimized policy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trader/portfolio_live.py trader/scalping.py tests/test_portfolio_live.py
          git commit -m "Improve scalp risk reward and timeout exits" || exit 0
          git push
