name: Apply local stop-loss patch
on:
  push:
    branches: [fix/local-stoploss-engine]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/local-stoploss-engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_local_stoploss.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use local stop-loss engine by default'
          git push
