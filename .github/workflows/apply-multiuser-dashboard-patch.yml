name: Apply multi-user dashboard patch

on:
  push:
    branches:
      - feat/multiuser-onboarding

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_multiuser_dashboard_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/trading-dashboard.tsx
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add logout and user-isolated wallet cards"
            git push
          fi
