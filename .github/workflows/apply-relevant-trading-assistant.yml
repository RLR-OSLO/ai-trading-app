name: Apply relevant trading assistant

on:
  push:
    branches:
      - fix/relevant-trading-assistant

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run relevant trading assistant patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_trading_assistant.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/trading-dashboard.tsx
          git commit -m "Make trading assistant answer from live data" || exit 0
          git push
