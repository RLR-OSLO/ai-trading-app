name: Apply server signal wrap

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_server_signal_wrap.py
      - name: Commit fix and remove temporary patch files
        run: |
          rm -f scripts/fix_server_signal_wrap.py .github/workflows/apply-server-signal-wrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Keep server status data inside panel"
            git push
          fi
