name: Apply stop-loss repair

on:
  push:
    branches:
      - fix/enforce-stop-loss-with-oco

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/enforce-stop-loss-with-oco
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply repair
        run: python scripts/apply_stoploss_dashboard_fix.py
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Enforce stop-loss and fix portfolio cost basis'
          git push
