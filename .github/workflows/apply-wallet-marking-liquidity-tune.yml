name: Apply wallet marking and liquidity tune

on:
  push:
    branches:
      - feat/market-brain-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/market-brain-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_wallet_marking_liquidity_tune.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use Binance wallet values for invested highlighting and tune liquidity'
          git push
