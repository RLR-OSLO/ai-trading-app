name: Verify Compass Google redirects
on:
  push:
    branches: [diagnose/vercel-access-20260915]
    paths: [.github/workflows/check-vercel-access.yml]
permissions:
  contents: read
jobs:
  verify-oauth:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify Google provider and both allowed return origins
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, urllib.error, json, base64
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl): return None
          opener = urllib.request.build_opener(NoRedirect)
          for origin in ["https://ai-trading-app-mocha.vercel.app", "https://ai-trading-app-git-repair-compas-5833a0-rudi-rorstad-s-projects.vercel.app"]:
              url = "https://nsqsqupucxgrkwotegof.supabase.co/auth/v1/authorize?" + urllib.parse.urlencode({"provider":"google","redirect_to":origin})
              try:
                  response = opener.open(url, timeout=25)
                  raise SystemExit("Expected OAuth redirect")
              except urllib.error.HTTPError as exc:
                  assert exc.code == 302, f"OAuth HTTP {exc.code}"
                  location = exc.headers.get("Location", "")
                  parsed = urllib.parse.urlparse(location)
                  assert parsed.hostname == "accounts.google.com", "Unexpected provider"
                  query = urllib.parse.parse_qs(parsed.query)
                  parts = query.get("state", [""])[0].split(".")
                  assert len(parts) == 3, "Unrecognized OAuth state format"
                  data = json.loads(base64.urlsafe_b64decode(parts[1] + "=" * (-len(parts[1]) % 4)))
                  print("OAUTH_STATE_FIELDS", ",".join(sorted(data.keys())))
                  assert data.get("referrer") == origin, "Requested redirect was not accepted"
                  assert query.get("redirect_uri") == ["https://nsqsqupucxgrkwotegof.supabase.co/auth/v1/callback"]
                  print("GOOGLE_REDIRECT_VERIFIED", origin)
          PY
