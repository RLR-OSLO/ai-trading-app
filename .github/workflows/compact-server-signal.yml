name: Compact server signal

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run server signal compaction patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/compact_server_signal.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/trading-dashboard.tsx app/globals.css
          git commit -m "Compact server signal with expand control" || exit 0
          git push
