[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-app"
version = "0.1.0"
description = "Risk-controlled Binance Spot trading engine"
requires-python = ">=3.12"

[project.scripts]
ai-trader = "trader.worker:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
